services:
  - type: web
    name: aquasens
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn aquasens.wsgi:application"
    envVars:
      - key: SECRET_KEY
        value: your-secret-key
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: your-app-name.onrender.com
